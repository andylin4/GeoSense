[project]
name = "geoguessr"
version = "0.1.0"
description = "GeoGuessr country prediction from screenshots: frozen CLIP backbone + trained country/meta heads"
requires-python = ">=3.11,<3.12"
dependencies = [
    # torch 2.12 dropped macosx_11 wheels in favor of macosx_14; cap on macOS 13.
    "torch>=2.2,<2.12; sys_platform == 'darwin'",
    "torch>=2.2; sys_platform != 'darwin'",
    "torchvision>=0.17",
    "transformers>=4.40",
    "pillow>=10.0",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
data = [
    "kagglehub>=0.3",
    "huggingface-hub>=0.23",
    "duckdb>=1.0",
]
serve = [
    "mss>=9.0",
    "pynput>=1.7",
]
coreml = [
    "coremltools>=8.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoguessr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
